# ═══════════════════════════════════════════════════════════════
# SIH26189 — Criminal Network Analysis — Spring Boot Config
# ═══════════════════════════════════════════════════════════════

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}
spring.application.name=criminal-network

# ── H2 In-Memory Database (development / demo) ───────────────
spring.datasource.url=jdbc:h2:mem:crimenetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── File Upload ───────────────────────────────────────────────
# Max file size for document uploads (PDF, DOCX, CSV etc.)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Logging ───────────────────────────────────────────────────
logging.level.com.sih.criminalnetwork=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Jackson ───────────────────────────────────────────────────
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL

# ══════════════════════════════════════════════════════════════
